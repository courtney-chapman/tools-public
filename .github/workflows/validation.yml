name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check commit attribution
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 support/scripts/check_commit_attribution.py
      - name: Validate plugin catalog
        run: python3 support/scripts/validate_repository.py
      - name: Validate homepage catalog
        run: python3 support/scripts/build_homepage_catalog.py --check
      - name: Validate plugin ZIPs
        run: python3 support/scripts/package_plugins.py
      - name: Validate DD1149 app package
        run: python3 support/scripts/package_dd1149.py
      - name: Validate property app package
        run: python3 support/scripts/package_government_property_records.py
      - name: Validate physical inventory app package
        run: python3 support/scripts/package_physical_inventory.py
      - name: Validate custody receipt app package
        run: python3 support/scripts/package_property_custody_receipt.py
      - name: Validate disposition app package
        run: python3 support/scripts/package_disposition_preparation.py
      - name: Validate PMSA evidence toolkit package
        run: python3 support/scripts/package_pmsa_evidence_preparation.py
      - name: Validate source justification app package
        run: python3 support/scripts/package_noncompetitive_source_justification.py
      - name: Validate subcontracting plan app package
        run: python3 support/scripts/package_individual_subcontracting_plan.py
      - name: Validate subcontract negotiation memo package
        run: python3 support/scripts/package_subcontract_negotiation_memo.py
      - name: Validate audit organizer app package
        run: python3 support/scripts/package_offline_audit_organizer.py
      - name: Test audit organizer PDF and ZIP
        run: node support/scripts/test_offline_audit_organizer.cjs
      - name: Validate consent-to-subcontract app package
        run: python3 support/scripts/package_consent_to_subcontract.py
      - name: Test consent-to-subcontract app
        run: node support/scripts/test_consent_to_subcontract.cjs
      - name: Validate Procurement File Readiness Checklist package
        run: python3 support/scripts/package_cpsr_procurement_file_checklist.py
      - name: Test Procurement File Readiness Checklist
        run: node support/scripts/test_cpsr_procurement_file_checklist.cjs
      - name: Validate make-or-buy app package
        run: python3 support/scripts/package_make_or_buy.py
      - name: Test make-or-buy app
        run: node support/scripts/test_make_or_buy.cjs
      - name: Validate supplier performance app package
        run: python3 support/scripts/package_supplier_performance_evaluation.py
      - name: Test supplier performance app
        run: node support/scripts/test_supplier_performance_evaluation.cjs
      - name: Validate subcontract closeout app package
        run: python3 support/scripts/package_subcontract_closeout.py
      - name: Test subcontract closeout app
        run: node support/scripts/test_subcontract_closeout.cjs
      - name: Validate Weighted Guidelines Calculator package
        run: python3 support/scripts/package_weighted_guidelines.py
      - name: Test Weighted Guidelines Calculator bundle
        run: node support/scripts/test_weighted_guidelines.cjs
