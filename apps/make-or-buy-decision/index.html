nt:"?";font-style:normal;font-weight:700}.report-foot{border-top:1px solid #ccd7e2;margin-top:14px!important;padding-top:6px;color:#4b5563;font-size:10px}

</style></head><body>
<header><h1>Make-or-Buy Decision Worksheet</h1><small>Working draft · Revision 6</small></header>
<main class="shell"><nav id="tabs" class="tabs" aria-label="Worksheet sections"></nav><div class="utility"><span id="save-state" class="hint">No unsaved changes</span><div class="actions"><button id="import-button">Import JSON</button><button id="export-button">Export JSON</button></div></div><div id="statusbar" aria-live="polite"></div><div id="view"></div><div id="print-area" hidden></div><div id="toast" role="status" aria-live="polite"></div></main>
<footer>Built by Courtney · Revision 6 · Data stays in browser memory unless you export or copy it.</footer>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const SCHEMA='1.1', steps=[['requirement','1. Requirement'],['make','2. Make'],['buy','3. Buy'],['comparison','4. Compare'],['decision','5. Decision'],['procurement','6. Review'],['worksheet','7. Worksheet']];
const uid=()=>globalThis.crypto?.randomUUID?.()||'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const blank=()=>({schemaVersion:SCHEMA,requirement:{description:'',kind:'',quantity:'',needDate:'',program:'',contract:'',value:null,requester:'',prepared:'',specification:'',needType:'',restrictions:''},makeAlternative:{approach:'',organization:'',estimateMode:'Single',estimate:null,date:'',assumptions:'',capacity:'Unknown',expertise:'Unknown',equipment:'Unknown',staffing:'Unknown',schedule:'Unknown',technical:'Unknown',constraints:'',evidence:'',costs:[]},buyAlternative:{approach:'',supplier:'',estimateMode:'Single',estimate:null,date:'',assumptions:'',availability:'Unknown',technical:'Unknown',delivery:'Unknown',competition:'Unknown',risks:'Unknown',constraints:'',evidence:'',costs:[],suppliers:[]},hybridAlternative:{enabled:false,internalShare:'',externalShare:'',internalCost:null,externalCost:null,integrationCost:null,date:'',risks:'',assumptions:''},costComparison:{comparable:'Unknown',basis:'',recurring:'',oneTime:''},scheduleComparison:{notes:''},riskAssessment:[],smallBusinessConsiderations:{sources:'Unknown',research:'Unknown',plan:'Unknown',notes:''},formalProgram:{applicability:'review',clause:'',programReference:'',item:'',designation:'',rationale:'',change:'Unknown',notice:'Unknown',approval:'Unknown',notes:''},decision:{choice:'Pending',rationale:'',nonLowest:'',participants:'',date:''},procurementReview:{disposition:'Not reviewed',reviewer:'',date:'',notes:'',restrictionsChecked:'Unknown'},supportingEvidence:[],documentStatus:'draft'});
let record=blank(),active='requirement',dirty=false;
function markDirty(value=true){dirty=value;const el=document.getElementById('save-state');if(el)el.textContent=dirty?'Unsaved changes · Export JSON':'No unsaved changes'}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(items,val)=>items.map(x=>{const [value,label]=Array.isArray(x)?x:[x,x];return `<option value="${esc(value)}" ${value===val?'selected':''}>${esc(label)}</option>`}).join('');
const path=(obj,key)=>obj[key];
const field=(group,key,label,type='text',opts={})=>{const v=path(record[group],key),id=group+'-'+key,common=`id="${id}" data-group="${group}" data-key="${key}"`;let control=type==='select'?`<select ${common}>${options(opts.items||[],v)}</select>`:type==='textarea'?`<textarea ${common}>${esc(v)}</textarea>`:`<input ${common} type="${type==='money'?'number':type}" value="${esc(v)}" ${type==='money'?'min="0" max="1000000000000" step="0.01"':''}>`;return `<div class="${opts.wide?'wide':''}"><label for="${id}">${esc(label)}</label>${control}${opts.hint?`<div class="hint">${esc(opts.hint)}</div>`:''}</div>`};
const choiceIcons={Unknown:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.5 2c-.9.6-2 1.2-2 2.5M12 17h.01"/>',Yes:'<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>',No:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>',Low:'<path d="M4 19h4v-5H4z"/>',Medium:'<path d="M4 19h4v-5H4zm6 0h4v-9h-4z"/>',High:'<path d="M4 19h4v-5H4zm6 0h4v-9h-4zm6 0h4V5h-4z"/>',Pending:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',Make:'<path d="M3 20h18M5 20V8l7-4 7 4v12M9 11h2m2 0h2M9 15h2m2 0h2"/>',Buy:'<path d="M3 5h2l2 11h11l2-8H6M9 20h.01M17 20h.01"/>',Single:'<path d="M4 12h16M4 17h16M4 7h16"/>',Itemized:'<path d="M4 7h3m3 0h10M4 12h3m3 0h10M4 17h3m3 0h10"/>',Hybrid:'<path d="M4 7h7l3 5h6M4 17h7l3-5h6M18 5l2 2-2 2m0 6 2 2-2 2"/>'};
function choice(group,key,label,items,scope={}){const value=scope.list?scope.row[key]:record[group][key],id=scope.list?`${scope.list}-${scope.row.id}-${key}`:`${group}-${key}`,attrs=scope.list?`data-list="${esc(scope.list)}" data-id="${esc(scope.row.id)}"`:`data-group="${esc(group)}"`;return `<fieldset class="choice-field"><legend>${esc(label)}</legend><div class="choice-set">${items.map(([v,name,icon])=>`<label class="choice-option"><input type="radio" name="${esc(id)}" value="${esc(v)}" ${attrs} data-key="${esc(key)}" ${v===value?'checked':''}><span class="choice-face"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${choiceIcons[icon]||choiceIcons.Unknown}</svg><span>${esc(name)}</span></span></label>`).join('')}</div></fieldset>`}
const yn=(g,k,l)=>choice(g,k,l,[['Unknown','Unknown','Unknown'],['Yes','Yes','Yes'],['No','No','No']]);
const riskLevels=['Unknown','Low','Medium','High'];
function costs(group){const rows=record[group].costs,itemized=record[group].estimateMode==='Itemized';return `<details><summary>Cost breakdown (${rows.length})</summary>${choice(group,'estimateMode','Estimate used for comparison',[["Single","Single total","Single"],["Itemized","Itemized","Itemized"]])}<p class="hint">${itemized?'Itemized rows drive the comparison; the single total remains a cross-check.':'The single total drives the comparison. Saved itemized rows are retained.'}</p>${itemized?`<div id="${group}-costrows">${rows.map((r,i)=>`<div class="row"><div class="row-head"><strong>Cost ${i+1}</strong><button type="button" data-remove="${group}.costs" data-id="${esc(r.id)}" aria-label="Remove cost ${i+1}">Remove</button></div><div class="grid">${rowField(group,'costs',r,'name','Cost element')}${rowField(group,'costs',r,'amount','Amount','money')}${rowField(group,'costs',r,'timing','Timing','select',['One-time','Recurring'])}${rowField(group,'costs',r,'basis','Estimate basis')}</div></div>`).join('')}</div><button type="button" data-add="${group}.costs">Add cost</button>`:''}</details>`}

function rowField(group,list,row,key,label,type='text',items=[]){let id=`${group}-${list}-${row.id}-${key}`,attrs=`id="${esc(id)}" data-list="${group}.${list}" data-id="${esc(row.id)}" data-key="${key}"`,v=row[key];return `<div><label for="${esc(id)}">${esc(label)}</label>${type==='select'?`<select ${attrs}>${options(items,v)}</select>`:`<input ${attrs} type="${type==='money'?'number':'text'}" value="${esc(v)}" ${type==='money'?'min="0" max="1000000000000" step="0.01"':''}>`}</div>`}
const intro={requirement:'Program · Define the need.',make:'Program · Internal option.',buy:'Program · External option.',comparison:'Program · Compare estimates and risks.',decision:'Program · Proposed choice and rationale.',procurement:'Procurement · Contract check and internal review. No Government approval is conferred.',worksheet:'Review · Copy or print the record.'};

wField('riskAssessment',r,'factor','Factor')}${rootRowField('riskAssessment',r,'make','Make rating','select',riskLevels)}${rootRowField('riskAssessment',r,'buy','Buy rating','select',riskLevels)}${rootRowField('riskAssessment',r,'hybrid','Hybrid rating','select',riskLevels)}${rootRowField('riskAssessment',r,'note','Explanation or evidence')}</div></div>`).join('')}<button data-add="riskAssessment">Add risk factor</button></details><details><summary>Small-business considerations (optional)</summary><p class="hint">Use when Buy or Hybrid is considered. Check the actual subcontracting plan and contract clauses.</p><div class="grid">${yn('smallBusinessConsiderations','sources','Potential small-business sources')}${yn('smallBusinessConsiderations','research','Market research performed')}${yn('smallBusinessConsiderations','plan','Applicable plan commitments affected')}${field('smallBusinessConsiderations','notes','Notes or references','textarea',{wide:true})}</div></details></details><div class="comparison-footer"><button type="button" data-export="true">Export JSON</button><button class="primary" data-next="decision">Continue to Program decision →</button></div>`}

tRowField('supportingEvidence',r,'note','What it supports')}</div></div>`).join('')}<button data-add="supportingEvidence">Add reference</button></details><div class="actions"><button class="primary" data-next="worksheet">Continue to worksheet</button></div>`}

function renderFormal(){if(record.formalProgram.applicability!=='applies')return '';return `<div class="grid" style="margin-top:12px">${field('formalProgram','clause','Incorporated clause / provision')}${field('formalProgram','programReference','Program reference')}${field('formalProgram','item','Item or work effort')}${field('formalProgram','designation','Proposed designation','select',{items:[['','Choose designation'],'Make','Buy','Deferred','Other']})}${field('formalProgram','rationale','Program rationale','textarea',{wide:true})}${yn('formalProgram','change','Change to an incorporated program?')}${yn('formalProgram','notice','Written CO notice submitted?')}${yn('formalProgram','approval','Written CO approval received?')}</div>`}
function money(v){return v===null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v)}
function amountFrom(el){if(el.value.trim()==='')return null;const n=Number(el.value);if(!Number.isFinite(n)||n<0||n>1e12||!/^(?:\d+)(?:\.\d{1,2})?$/.test(el.value.trim()))throw Error('Enter a valid amount from 0 to 1 trillion, with at most two decimals.');return n}
function estimateFor(a){
 const entered=a.costs.filter(x=>x.amount!==null),sum=Math.round(entered.reduce((n,x)=>n+x.amount,0)*100)/100;
 const hasItems=a.estimateMode==='Itemized',partial=hasItems&&(a.costs.length===0||entered.length!==a.costs.length);
 return {value:hasItems?(partial?null:sum):a.estimate,enteredSum:hasItems&&entered.length?sum:null,mode:hasItems?'Itemized':a.estimate!==null?'Single estimate':'Missing',partial,discrepancy:hasItems&&!partial&&a.estimate!==null&&Math.abs(sum-a.estimate)>.009,oneTime:hasItems?entered.filter(x=>x.timing==='One-time').reduce((n,x)=>n+x.amount,0):0,recurring:hasItems?entered.filter(x=>x.timing==='Recurring').reduce((n,x)=>n+x.amount,0):0,hasRecurring:hasItems&&entered.some(x=>x.timing==='Recurring')};
}
function hybridEstimate(){
 if(!record.hybridAlternative.enabled)return {value:null,enteredSum:null,mode:'Not considered',partial:false};
 const h=record.hybridAlternative,parts=[h.internalCost,h.externalCost,h.integrationCost],partial=parts.some(x=>x===null),sum=Math.round(parts.reduce((n,x)=>n+(x??0),0)*100)/100;
 return {value:partial?null:sum,enteredSum:parts.some(x=>x!==null)?sum:null,mode:'Three-part estimate',partial};
}
function displayEstimate(e){return e.partial?(e.enteredSum===null?'Incomplete':money(e.enteredSum)+' (partial)'):money(e.value)}
function dayDifference(a,b){if(!a||!b)return null;const x=Date.parse(a+'T00:00:00Z'),y=Date.parse(b+'T00:00:00Z');return Number.isFinite(x)&&Number.isFinite(y)?Math.round((x-y)/86400000):null}
function issues(){
 const missing=[],comparison=[],regulatory=[],review=[],r=record.requirement,d=record.decision;
 const estimates={Make:estimateFor(record.makeAlternative),Buy:estimateFor(record.buyAlternative),Hybrid:hybridEstimate()};
 const comparable=record.costComparison.comparable==='Yes'&&(!(estimates.Make.hasRecurring||estimates.Buy.hasRecurring)||record.costComparison.recurring.trim());
 if(!r.description.trim())missing.push('Requirement description');
 if(d.choice!=='Pending'&&!d.rationale.trim())missing.push('Decision rationale');
 if(d.choice==='Hybrid'&&!record.hybridAlternative.enabled)missing.push('Enable and describe the selected Hybrid alternative');
 if(d.choice!=='Pending'&&estimates[d.choice]?.value===null)missing.push('Selected alternative cost estimate');
 const approaches={Make:record.makeAlternative.approach,Buy:record.buyAlternative.approach,Hybrid:record.hybridAlternative.internalShare+' '+record.hybridAlternative.externalShare};
 if(d.choice!=='Pending'&&!approaches[d.choice]?.trim())missing.push('Selected alternative approach');
 for(const [name,e] of Object.entries(estimates)){
  if(name==='Hybrid'&&!record.hybridAlternative.enabled)continue;
  if(e.partial)comparison.push(name+' itemized estimate is incomplete');
  if(e.discrepancy)comparison.push(name+' single total differs from itemized costs');
 }
 if(record.costComparison.comparable!=='Yes'&&[estimates.Make.value,estimates.Buy.value].every(x=>x!==null))comparison.push('Make and Buy estimates are not confirmed comparable in quantity, period, scope and assumptions');
 if(estimates.Make.value===null||estimates.Buy.value===null)comparison.push('One or both baseline estimates are missing');
 if(estimates.Make.value!==null&&!record.makeAlternative.assumptions.trim())comparison.push('Make estimate assumptions are missing');
 if(estimates.Buy.value!==null&&!record.buyAlternative.assumptions.trim())comparison.push('Buy estimate assumptions are missing');
 if((estimates.Make.hasRecurring||estimates.Buy.hasRecurring)&&!record.costComparison.recurring.trim())comparison.push('State the recurring cost period before comparing totals');
 if(record.hybridAlternative.enabled&&estimates.Hybrid.value!==null&&!record.hybridAlternative.assumptions.trim())comparison.push('Hybrid estimate assumptions are missing');
 if(r.needDate)for(const [name,date] of [['Make',record.makeAlternative.date],['Buy',record.buyAlternative.date],...(record.hybridAlternative.enabled?[['Hybrid',record.hybridAlternative.date]]:[])]){
  const days=dayDifference(date,r.needDate);if(days>0)comparison.push(name+' estimated date is '+days+' calendar days after the need date; review mitigation');
 }
 if(d.choice!=='Pending'){
  const chosen=estimates[d.choice]?.value,others=Object.entries(estimates).filter(([name])=>name!=='Hybrid'||record.hybridAlternative.enabled).map(([,e])=>e.value).filter(x=>x!==null);
  if(comparable&&chosen!==null&&others.some(x=>x<chosen)&&!d.nonLowest.trim())comparison.push('Explain why the selected approach has a higher estimated cost');
 }
 const p=record.formalProgram;
 if(p.applicability==='review')regulatory.push('Formal make-or-buy program applicability needs contract review');
  if(p.applicability==='does-not-apply'&&!p.notes.trim())regulatory.push('Record the basis for concluding no formal program applies');
 if(r.restrictions.trim()&&record.procurementReview.restrictionsChecked!=='Yes')regulatory.push('Review the recorded contract restrictions');
 if(p.applicability==='applies'){
  if(!p.clause.trim()||!p.programReference.trim())regulatory.push('Identify the governing clause and incorporated program');
  if(!p.item.trim()||!p.designation||!p.rationale.trim())regulatory.push('Complete the formal program item, designation and rationale');
  if(p.change==='Unknown')regulatory.push('Confirm whether this is a change to an incorporated program');
  if(p.change==='Yes'&&p.notice!=='Yes')regulatory.push('Confirm advance written notice and justification for the proposed program change');
  if(p.change==='Yes'&&p.approval!=='Yes')regulatory.push('Confirm written CO approval before treating a proposed change as effective');
 }
 const pr=record.procurementReview;
 if(pr.disposition==='Reviewed'&&(!pr.reviewer.trim()||!pr.date))review.push('Record Procurement reviewer and review date');
 if(pr.disposition==='Needs follow-up'&&!pr.notes.trim())review.push('Describe the follow-up needed');
 return {missing,comparison,regulatory,review};
}
function status(){
 const v=issues(),p=record.formalProgram,pr=record.procurementReview;
 const formalOpen=p.applicability==='review'||p.applicability==='applies'&&v.regulatory.some(x=>!x.startsWith('Review the recorded contract restrictions'));
 const s=record.decision.choice==='Pending'||v.missing.length?'Draft':formalOpen?'Formal Program Review Required':pr.disposition==='Not reviewed'?'Ready for Procurement Review':pr.disposition==='Needs follow-up'?'Procurement Follow-up':v.review.length?'Procurement Review Incomplete':v.comparison.length||v.regulatory.length?'Reviewed with Open Items':'Procurement Review Documented';
 record.documentStatus=s.toLowerCase().replaceAll(' ','-');return s;
}
const stateTone=s=>s==='Procurement Review Documented'?'good':s==='Draft'||s==='Ready for Procurement Review'?'info':s==='Reviewed with Open Items'||s==='Procurement Follow-up'||s==='Procurement Review Incomplete'?'warn':'warn';
function metric(label,count,tone){return `<span class="metric ${tone}"><span class="metric-dot" aria-hidden="true"></span>${count} ${esc(label)}</span>`}
function renderStatus(){const s=status(),v=issues();const summary=`${s}|${v.missing.length}|${v.comparison.length}|${v.regulatory.length}|${v.review.length}`;if($('statusbar').dataset.summary!==summary){$('statusbar').dataset.summary=summary;$('statusbar').innerHTML=`<div class="status-strip"><strong class="state-pill ${stateTone(s)}"><span class="metric-dot" aria-hidden="true"></span>${esc(s)}</strong><div class="metric-row">${metric('missing',v.missing.length,v.missing.length?'warn':'good')}${metric('comparison',v.comparison.length,v.comparison.length?'warn':'good')}${metric('contract',v.regulatory.length,v.regulatory.length?'warn':'good')}${metric('review',v.review.length,v.review.length?'warn':'good')}</div><span class="hint">Internal record · not approval</span></div>`;}if(active==='comparison')$('comparison-dashboard').innerHTML=comparisonDashboardHTML();if(active==='worksheet'){ $('issues').innerHTML=issueHTML(v);$('preview').innerHTML=worksheetHTML()}markDirty(dirty)}
function issueHTML(v){return [['Missing information',v.missing],['Comparison',v.comparison],['Contract',v.regulatory],['Procurement review',v.review]].map(([title,items])=>`<div class="issue-group"><div class="issue-head"><span class="metric-dot ${items.length?'warn':'good'}" aria-hidden="true"></span><strong>${title}</strong><span class="issue-count">${items.length}</span></div>${items.length?items.map(x=>`<div class="issue">${esc(x)}</div>`).join(''):'<div class="hint">Clear</div>'}</div>`).join('')}

function comparisonDashboardHTML(){
 const make=estimateFor(record.makeAlternative),buy=estimateFor(record.buyAlternative),hybrid=hybridEstimate(),includeHybrid=record.hybridAlternative.enabled;
 const columns=includeHybrid?['Make','Buy','Hybrid']:['Make','Buy'];
 const rows=new Map(),occurrences={Make:{},Buy:{},Hybrid:{}};
 const add=(path,name,amount)=>{const label=name.trim()||'Unnamed cost',count=(occurrences[path][label]||0)+1;occurrences[path][label]=count;const key=label+'\u0000'+count;if(!rows.has(key))rows.set(key,{name:label,Make:null,Buy:null,Hybrid:null});rows.get(key)[path]=amount};
 for(const [path,alternative] of [['Make',record.makeAlternative],['Buy',record.buyAlternative]]){
  if(alternative.estimateMode==='Itemized'){if(alternative.costs.length)for(const row of alternative.costs)add(path,row.name,row.amount);else add(path,'Itemized costs not entered',null)}
  else add(path,'Single estimate',alternative.estimate);
 }
 if(includeHybrid){add('Hybrid','Internal share',record.hybridAlternative.internalCost);add('Hybrid','External share',record.hybridAlternative.externalCost);add('Hybrid','Integration',record.hybridAlternative.integrationCost)}
 const all=[...rows.values()],visible=all.slice(0,8),extra=all.length-visible.length;
 const table=`<div class="table-wrap"><table class="compare-matrix"><thead><tr><th>Cost element</th>${columns.map(x=>`<th class="num">${x}</th>`).join('')}</tr></thead><tbody>${visible.map(row=>`<tr><td>${esc(row.name)}</td>${columns.map(x=>`<td class="num">${money(row[x])}</td>`).join('')}</tr>`).join('')}${extra?`<tr class="more-row"><td colspan="${columns.length+1}">${extra} more cost ${extra===1?'row':'rows'} in cost breakdowns</td></tr>`:''}<tr class="total-row"><th>Total</th><td class="num">${displayEstimate(make)}</td><td class="num">${displayEstimate(buy)}</td>${includeHybrid?`<td class="num">${displayEstimate(hybrid)}</td>`:''}</tr></tbody></table></div>`;
 const comparable=record.costComparison.comparable==='Yes'&&make.value!==null&&buy.value!==null&&(!(make.hasRecurring||buy.hasRecurring)||record.costComparison.recurring.trim());
 const difference=comparable?Math.round(Math.abs(make.value-buy.value)*100)/100:null;
 const summary=comparable?`Comparable basis confirmed · ${difference===0?'Make and Buy estimates are equal':`${make.value<buy.value?'Make':'Buy'} is ${money(difference)} lower`}`:make.value===null||buy.value===null?'Enter both estimates to compare':record.costComparison.comparable==='No'?'Basis differs · cost difference not shown':record.costComparison.comparable!=='Yes'?'Confirm comparable scope and period':`Set the recurring comparison period`;
 const risk=record.riskAssessment.find(x=>/technical/i.test(x.factor));
 const formatDate=date=>date?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(date+'T00:00:00Z')):'Date not entered';
 const card=(name,date,rating)=>{const days=dayDifference(date,record.requirement.needDate),tone=days===null?'info':days>0?'warn':'good',tag=days===null?'Date to confirm':days>0?`${days} ${days===1?'day':'days'} after need date`:'On or before need date';return `<div class="schedule-card"><div class="schedule-head"><span>${esc(name)}</span><span class="schedule-tag ${tone}">${esc(tag)}</span></div><strong>${date?'Delivers '+esc(formatDate(date)):formatDate(date)}</strong><div class="schedule-risk">Technical risk ${ratingPill(rating)}</div></div>`};
 const cards=`<div class="schedule-grid">${card('Make',record.makeAlternative.date,risk?.make||'Unknown')}${card('Buy',record.buyAlternative.date,risk?.buy||'Unknown')}${includeHybrid?card('Hybrid',record.hybridAlternative.date,risk?.hybrid||'Unknown'):''}</div>`;
 return `<div class="compare-dashboard">${table}<div class="compare-callout ${comparable?'good':'warn'}"><span class="metric-dot" aria-hidden="true"></span><strong>${esc(summary)}</strong></div>${cards}</div>`
}

const shown=x=>x===null||x===''?'[INSERT]':String(x);
function reportPairs(rows){const kept=rows.filter(([,v])=>v!==''&&v!==null&&v!==undefined);return kept.length?`<table class="report-pairs"><tbody>${kept.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`:''}
function reportSection(title,body){return body?`<section class="report-section"><h2>${esc(title)}</h2>${body}</section>`:''}
function reportCosts(name,a){if(!a.costs.length)return '';return `<h3>${esc(name)} cost rows <span class="section-tag">${a.estimateMode==='Itemized'?'Used in comparison':'Saved, not used'}</span></h3>${a.estimateMode==='Itemized'&&a.estimate!==null?`<p class="report-note">Reference single total: ${money(a.estimate)}</p>`:''}<div class="table-wrap"><table><thead><tr><th>Element</th><th class="num">Amount</th><th>Timing</th><th>Basis</th></tr></thead><tbody>${a.costs.map(x=>`<tr><td>${esc(shown(x.name))}</td><td class="num">${money(x.amount)}</td><td>${esc(x.timing)}</td><td>${esc(x.basis)}</td></tr>`).join('')}</tbody></table></div>`}
function ratingPill(value){const bars={Low:1,Medium:2,High:3}[value]||0;return `<span class="risk-pill"><span class="risk-bars" aria-hidden="true">${bars?Array.from({length:3},(_,i)=>`<i class="${i<bars?'on':''}"></i>`).join(''):'<i class="unknown"></i>'}</span>${esc(value)}</span>`}
function worksheetHTML(){
 const r=record,v=issues(),state=status(),make=estimateFor(r.makeAlternative),buy=estimateFor(r.buyAlternative),h=hybridEstimate(),pr=r.procurementReview;
 const context=reportPairs([['Requirement',shown(r.requirement.description)],['Supplies / services',r.requirement.kind],['Need type',r.requirement.needType],['Quantity / effort',r.requirement.quantity],['Need date',r.requirement.needDate],['Program / project',r.requirement.program],['Prime contract',r.requirement.contract],['Requirement value',r.requirement.value===null?'':money(r.requirement.value)],['Requester',r.requirement.requester],['Prepared',r.requirement.prepared],['Specification / reference',r.requirement.specification],['Known restrictions',r.requirement.restrictions]]);
 const alternatives=`<div class="table-wrap"><table><thead><tr><th>Path</th><th>Approach</th><th class="num">Estimated total</th><th>Target date</th><th>Estimate basis</th></tr></thead><tbody><tr><th>Make</th><td>${esc(shown(r.makeAlternative.approach))}</td><td class="num">${displayEstimate(make)}</td><td>${esc(shown(r.makeAlternative.date))}</td><td>${esc(r.makeAlternative.assumptions)}</td></tr><tr><th>Buy</th><td>${esc(shown(r.buyAlternative.approach))}</td><td class="num">${displayEstimate(buy)}</td><td>${esc(shown(r.buyAlternative.date))}</td><td>${esc(r.buyAlternative.assumptions)}</td></tr>${r.hybridAlternative.enabled?`<tr><th>Hybrid</th><td>Internal: ${esc(shown(r.hybridAlternative.internalShare))}<br>External: ${esc(shown(r.hybridAlternative.externalShare))}</td><td class="num">${displayEstimate(h)}</td><td>${esc(shown(r.hybridAlternative.date))}</td><td>${esc(r.hybridAlternative.assumptions)}</td></tr>`:''}</tbody></table></div>`;
 const makeDetails=reportPairs([['Organization',r.makeAlternative.organization],['Capacity',r.makeAlternative.capacity],['Expertise',r.makeAlternative.expertise],['Equipment',r.makeAlternative.equipment],['Staffing',r.makeAlternative.staffing],['Schedule feasible',r.makeAlternative.schedule],['Technical',r.makeAlternative.technical],['Constraints',r.makeAlternative.constraints],['Evidence',r.makeAlternative.evidence]]);
 const buyDetails=reportPairs([['Supplier / category',r.buyAlternative.supplier],['Availability',r.buyAlternative.availability],['Technical',r.buyAlternative.technical],['Delivery',r.buyAlternative.delivery],['Competition',r.buyAlternative.competition],['Risks controlled',r.buyAlternative.risks],['Constraints',r.buyAlternative.constraints],['Evidence',r.buyAlternative.evidence]]);
 const details=`<div class="report-columns"><div><h3>Make details</h3>${makeDetails}</div><div><h3>Buy details</h3>${buyDetails}</div></div>${r.hybridAlternative.enabled?`<h3>Hybrid details</h3>${reportPairs([['Internal cost',money(r.hybridAlternative.internalCost)],['External cost',money(r.hybridAlternative.externalCost)],['Integration cost',money(r.hybridAlternative.integrationCost)],['Coordination risks',r.hybridAlternative.risks]])}`:''}`;
 const suppliers=r.buyAlternative.suppliers.length?`<h3>Potential suppliers</h3><table><thead><tr><th>Name / category</th><th>Source / note</th></tr></thead><tbody>${r.buyAlternative.suppliers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>`:'';
 const costs=reportCosts('Make',r.makeAlternative)+reportCosts('Buy',r.buyAlternative);
 const costBasis=reportPairs([['Comparable scope',r.costComparison.comparable],['Basis / differences',r.costComparison.basis],['Recurring period',r.costComparison.recurring],['One-time treatment',r.costComparison.oneTime],['Schedule dependencies',r.scheduleComparison.notes]]);
 const risk=r.riskAssessment.length?`<h3>Risk factors</h3><table><thead><tr><th>Factor</th><th>Make</th><th>Buy</th>${r.hybridAlternative.enabled?'<th>Hybrid</th>':''}<th>Evidence / note</th></tr></thead><tbody>${r.riskAssessment.map(x=>`<tr><td>${esc(x.factor)}</td><td>${ratingPill(x.make)}</td><td>${ratingPill(x.buy)}</td>${r.hybridAlternative.enabled?`<td>${ratingPill(x.hybrid)}</td>`:''}<td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>`:'';
 const small=reportPairs([['Potential small-business sources',r.smallBusinessConsiderations.sources],['Market research',r.smallBusinessConsiderations.research],['Plan commitments affected',r.smallBusinessConsiderations.plan],['Notes / references',r.smallBusinessConsiderations.notes]]);
 const decision=reportPairs([['Proposed approach',r.decision.choice],['Program decision date',r.decision.date],['Rationale',shown(r.decision.rationale)],['Higher-cost rationale',r.decision.nonLowest],['Participants',r.decision.participants]]);
 const formal=reportPairs([['Formal program',r.formalProgram.applicability==='review'?'Needs review':r.formalProgram.applicability==='applies'?'Applies':'Does not apply'],['Applicability basis / questions',r.formalProgram.notes],...(r.formalProgram.applicability==='applies'?[['Clause / provision',r.formalProgram.clause],['Program reference',r.formalProgram.programReference],['Item / effort',r.formalProgram.item],['Proposed designation',r.formalProgram.designation],['Program rationale',r.formalProgram.rationale],['Incorporated-program change',r.formalProgram.change],['Written CO notice',r.formalProgram.notice],['Written CO approval',r.formalProgram.approval]]:[])]);
 const review=reportPairs([['Disposition',pr.disposition],['Reviewer',pr.reviewer],['Review date',pr.date],['Notes / references',pr.notes],['Restrictions checked',r.requirement.restrictions.trim()?pr.restrictionsChecked:'']])+`<h3>Contract applicability</h3>${formal}`;
 const evidence=r.supportingEvidence.length?`<table><thead><tr><th>Kind</th><th>Reference</th><th>Supports</th></tr></thead><tbody>${r.supportingEvidence.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.reference)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>`:'';
 const groups=[['Missing',v.missing],['Comparison',v.comparison],['Contract',v.regulatory],['Review',v.review]];
 const open=groups.some(([,items])=>items.length)?groups.filter(([,items])=>items.length).map(([title,items])=>`<h3>${title} <span class="section-tag">${items.length}</span></h3>${items.map(x=>`<div class="issue missing"><span class="issue-box" aria-hidden="true"></span>${esc(x)}</div>`).join('')}`).join(''):'<p class="report-clear">✓ No open items flagged</p>';
 return `<article class="paper"><div class="report-head"><div><h1>Make-or-Buy Decision Worksheet</h1><p>Program proposal · Procurement review</p></div><strong class="state-pill ${stateTone(state)}"><span class="metric-dot" aria-hidden="true"></span>${esc(state)}</strong></div><div class="report-metrics">${metric('missing',v.missing.length,v.missing.length?'warn':'good')}${metric('comparison',v.comparison.length,v.comparison.length?'warn':'good')}${metric('contract',v.regulatory.length,v.regulatory.length?'warn':'good')}${metric('review',v.review.length,v.review.length?'warn':'good')}</div>${reportSection('1. Requirement',context)}${reportSection('2. Alternatives',alternatives+details+suppliers+costs)}${reportSection('3. Comparison',costBasis+comparisonDashboardHTML())}${reportSection('4. Risk & small business',risk+`<h3>Small-business considerations</h3>`+small)}${reportSection('5. Program proposal',decision)}${reportSection('6. Procurement review',review)}${reportSection('7. Supporting references',evidence||'<p class="report-empty">None recorded</p>')}${reportSection('8. Open items',open)}<p class="report-foot">Working record · User-entered estimates and assessments · No Government approval conferred</p></article>`
}
function worksheetText(){const host=document.createElement('div');host.innerHTML=worksheetHTML();const lines=[];for(const el of host.querySelectorAll('h1,h2,h3,p,tr,.report-metrics .metric,.report-head .state-pill,.issue')){if(el.matches('tr'))lines.push([...el.children].map(x=>x.textContent.trim()).join('\t'));else lines.push(el.textContent.trim())}return lines.filter(Boolean).join('\n')}

function renderPrint(){$('print-area').innerHTML=worksheetHTML()}
function aiPrompt(){return `Review this make-or-buy decision record. Compare user-entered cost, schedule, capability and risk information; identify unsupported assumptions and missing evidence; and improve the decision narrative without changing any amount, date, fact, assumption or conclusion. Do not invent supplier quotes, capacity, estimates, Government approval, or a compliance determination. Mark gaps with [INSERT]. Return compatible JSON with schemaVersion ${SCHEMA} for reimport. External AI sharing requires authorization.\n\nJSON:\n${JSON.stringify(record,null,2)}`}
function download(name,content){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Copied.')}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Copied.':'Copy failed. Select and copy the worksheet preview instead.')}}
function toast(s){$('toast').textContent=s;setTimeout(()=>{if($('toast').textContent===s)$('toast').textContent=''},5000)}
function validateImport(x){const legacy=x?.schemaVersion==='1.0',template=blank();if(legacy){template.schemaVersion='1.0';delete template.procurementReview;delete template.makeAlternative.estimateMode;delete template.buyAlternative.estimateMode;template.decision.reviewer='';template.decision.references=''}if(!x||typeof x!=='object'||Array.isArray(x)||!['1.0',SCHEMA].includes(x.schemaVersion))throw Error('Unsupported schema version. Expected 1.0 or '+SCHEMA+'.');function check(v,t,p){if(Array.isArray(t)){if(!Array.isArray(v)||v.length>200)throw Error('Invalid '+p);const names=p.endsWith('.costs')?{id:'',name:'',amount:null,timing:'One-time',basis:''}:p.endsWith('.suppliers')?{id:'',name:'',note:''}:p==='riskAssessment'?{id:'',factor:'',make:'Unknown',buy:'Unknown',hybrid:'Unknown',note:''}:{id:'',kind:'',reference:'',note:''};const ids=new Set();for(const row of v){check(row,names,p+' item');if(!row.id||ids.has(row.id))throw Error('Duplicate or empty '+p+' ID');ids.add(row.id)}return}if(t&&typeof t==='object'){if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!(k in t))||Object.keys(t).some(k=>!(k in v)))throw Error('Invalid '+p+' fields');for(const k of Object.keys(t))check(v[k],t[k],p+'.'+k);return}if(t===null){if(v!==null&&(!Number.isFinite(v)||v<0||v>1e12||Math.abs(Math.round(v*100)-v*100)>1e-6))throw Error('Invalid amount in '+p);return}if(typeof v!==typeof t||typeof v==='string'&&v.length>10000)throw Error('Invalid '+p)}check(x,template,'record');const enumCheck=(v,values,p)=>{if(!values.includes(v))throw Error('Invalid '+p)};enumCheck(x.decision.choice,['Pending','Make','Buy','Hybrid'],'choice');if(!legacy){enumCheck(x.procurementReview.disposition,['Not reviewed','Needs follow-up','Reviewed'],'review disposition');for(const g of ['makeAlternative','buyAlternative'])enumCheck(x[g].estimateMode,['Single','Itemized'],g+' estimate mode')}enumCheck(x.formalProgram.applicability,['review','applies','does-not-apply'],'program applicability');enumCheck(x.costComparison.comparable,['Unknown','Yes','No'],'comparability');for(const g of ['makeAlternative','buyAlternative'])for(const row of x[g].costs)enumCheck(row.timing,['One-time','Recurring'],'cost timing');for(const row of x.riskAssessment)for(const k of ['make','buy','hybrid'])enumCheck(row[k],riskLevels,'risk rating');for(const g of legacy?['makeAlternative','buyAlternative','smallBusinessConsiderations','formalProgram']:['makeAlternative','buyAlternative','smallBusinessConsiderations','formalProgram','procurementReview'])for(const [k,v] of Object.entries(x[g]))if(['Yes','No','Unknown'].includes(template[g][k]))enumCheck(v,['Yes','No','Unknown'],g+'.'+k);for(const date of [x.requirement.needDate,x.requirement.prepared,x.makeAlternative.date,x.buyAlternative.date,x.hybridAlternative.date,x.decision.date,...(legacy?[]:[x.procurementReview.date])])if(date&&!validDate(date))throw Error('Invalid date');if(legacy){const {reviewer,references,...decision}=x.decision;return validateImport({...x,schemaVersion:SCHEMA,makeAlternative:{...x.makeAlternative,estimateMode:x.makeAlternative.costs.length?'Itemized':'Single'},buyAlternative:{...x.buyAlternative,estimateMode:x.buyAlternative.costs.length?'Itemized':'Single'},decision,procurementReview:{disposition:'Not reviewed',reviewer,date:'',notes:references,restrictionsChecked:'Unknown'}})}return x}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===s}
function importRecord(x){
 if(x&&typeof x==='object'&&!Array.isArray(x)&&x.requirement&&typeof x.requirement==='object'&&!Array.isArray(x.requirement)&&x.makeAlternative)return validateImport(x);
 const safeString=(v,p)=>{if(typeof v!=='string'||v.length>10000)throw Error('Invalid '+p);return v};
 const safeAmount=(v,p)=>{if(v===null||v==='')return null;if(typeof v!=='number'||!Number.isFinite(v)||v<0||v>1e12)throw Error('Invalid '+p);return v};
 if(!x||typeof x!=='object'||Array.isArray(x)||!['1.0','1.1','1.2'].includes(x.schemaVersion))throw Error('Unsupported JSON structure');
 const out=blank();
 if(typeof x.requirement==='string'&&Array.isArray(x.supportingReferences)&&typeof x.supplier==='string'){
  out.requirement.description=safeString(x.requirement,'requirement');out.buyAlternative.supplier=safeString(x.supplier,'supplier');out.buyAlternative.estimate=safeAmount(x.proposedAmount,'proposed amount');
  if(x.supportingReferences.length>100)throw Error('Too many references');
  out.supportingEvidence=x.supportingReferences.map((e,i)=>({id:'import-'+i,kind:'Imported reference',reference:safeString(e.title,'reference title'),note:safeString(e.supports,'reference purpose')}));
  return validateImport(out);
 }
 if(x.primeContract&&x.subcontract&&typeof x.subcontract==='object'&&typeof x.subcontract.scope==='string'){
  out.requirement.description=safeString(x.subcontract.scope,'subcontract scope');out.requirement.contract=safeString(x.primeContract.contractNumber,'contract number');out.requirement.program=safeString(x.subcontract.program,'program');out.buyAlternative.supplier=safeString(x.subcontract.supplierName,'supplier');
  const value=safeString(x.subcontract.value,'subcontract value');if(value.trim())out.buyAlternative.estimate=safeAmount(Number(value),'subcontract value');
  if(Array.isArray(x.supportingDocuments)){
   if(x.supportingDocuments.length>100)throw Error('Too many supporting documents');
   out.supportingEvidence=x.supportingDocuments.filter(e=>e.reference).map((e,i)=>({id:'import-'+i,kind:safeString(e.id,'document type'),reference:safeString(e.reference,'document reference'),note:'Imported document status: '+safeString(e.status,'document status')}));
  }
  return validateImport(out);
 }
 if(typeof x.description==='string'&&typeof x.supplier==='string'&&Array.isArray(x.evidence)&&Array.isArray(x.lineItems)){
  out.requirement.description=safeString(x.description,'description');out.buyAlternative.supplier=safeString(x.supplier,'supplier');
  if(x.evidence.length>100)throw Error('Too many references');
  out.supportingEvidence=x.evidence.map((e,i)=>({id:'import-'+i,kind:safeString(e.kind,'evidence kind'),reference:safeString(e.title||e.reference,'evidence reference'),note:safeString(e.summary,'evidence summary')}));
  return validateImport(out);
 }
 throw Error('JSON is not this worksheet or a recognized compatible procurement record');
}
function addRow(path){const [g,list]=path.split('.'),dest=list?record[g][list]:record[g];if(!Array.isArray(dest))return;if(dest.length>=(path==='riskAssessment'?20:100)){toast('This list is full.');return}const row=path.endsWith('.costs')?{id:uid(),name:'',amount:null,timing:'One-time',basis:''}:path.endsWith('.suppliers')?{id:uid(),name:'',note:''}:path==='riskAssessment'?{id:uid(),factor:'',make:'Unknown',buy:'Unknown',hybrid:'Unknown',note:''}:{id:uid(),kind:'',reference:'',note:''};dest.push(row);markDirty();render();[...$('view').querySelectorAll('[data-id]')].find(x=>x.dataset.id===row.id&&x.matches('input'))?.focus()}
function updateField(el){let target,key=el.dataset.key;try{if(el.dataset.list){const [g,list]=el.dataset.list.split('.'),rows=list?record[g][list]:record[g];target=rows.find(x=>x.id===el.dataset.id)}else if(el.dataset.group)target=record[el.dataset.group];if(!target)return;const next=el.type==='number'?amountFrom(el):el.value;if(target[key]!==next){target[key]=next;markDirty()}el.setCustomValidity('');renderStatus()}catch(e){if(target&&el.type==='number'&&target[key]!==null){target[key]=null;markDirty()}el.setCustomValidity(e.message);el.reportValidity();renderStatus();toast(e.message)}}
document.addEventListener('input',e=>{if(e.target.matches('[data-group],[data-list]'))updateField(e.target)});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-group],[data-list]')){updateField(el);if((el.dataset.group==='formalProgram'&&el.dataset.key==='applicability')||(['makeAlternative','buyAlternative'].includes(el.dataset.group)&&el.dataset.key==='estimateMode')){const name=el.name;render();[...$('view').querySelectorAll('input[type=radio]')].find(x=>x.name===name&&x.checked)?.focus()}}if(el.name==='hybrid-toggle'){record.hybridAlternative.enabled=el.value==='yes';markDirty();render();[...$('view').querySelectorAll('input[name=hybrid-toggle]')].find(x=>x.checked)?.focus()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.next){location.hash=b.dataset.next;return}if(b.dataset.add){addRow(b.dataset.add);return}if(b.dataset.remove){const path=b.dataset.remove,[g,list]=path.split('.'),dest=list?record[g][list]:record[g];if(!confirm('Remove this row?'))return;const i=dest.findIndex(x=>x.id===b.dataset.id);if(i>=0){dest.splice(i,1);markDirty()}render();[...$('view').querySelectorAll('[data-add]')].find(x=>x.dataset.add===path)?.focus();return}if(b.id==='copy-worksheet')await copyText(worksheetText());if(b.id==='copy-prompt')await copyText(aiPrompt());if(b.id==='print-button'){renderPrint();window.print()}if(b.id==='export-button'||b.dataset.export){status();download('make-or-buy-decision.json',JSON.stringify(record,null,2));markDirty(false);toast('JSON export started. Keep the file before closing this draft.')}if(b.id==='import-button')$('import-file').click();if(b.id==='clear-button'&&confirm('Clear the entire draft? Export JSON first if you need a copy.')){record=blank();markDirty(false);render();toast('Draft cleared.')}});
$('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>2_000_000)throw Error('JSON file exceeds 2 MB.');const source=JSON.parse(await f.text()),parsed=importRecord(source),native=!!(source.requirement&&typeof source.requirement==='object'&&source.makeAlternative);const mapped=[parsed.requirement.description?'requirement':null,parsed.requirement.contract?'contract':null,parsed.buyAlternative.supplier?'supplier':null,parsed.buyAlternative.estimate!==null?'buy estimate':null,parsed.supportingEvidence.length?parsed.supportingEvidence.length+' references':null].filter(Boolean).join(', ')||'no populated fields';const message=native?'Replace the current draft with the complete worksheet record?':'Replace the current draft? Only these compatible fields will be imported: '+mapped+'. Other source fields will be omitted.';if(!confirm(message))return;record=parsed;markDirty();render();toast('JSON imported. Export JSON to save this draft.')}catch(err){toast('Import rejected: '+err.message)}});
window.addEventListener('beforeprint',renderPrint);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',()=>{active=location.hash.slice(1)||'requirement';render();$('view').querySelector('h2')?.focus?.()});
active=location.hash.slice(1)||'requirement';render();
