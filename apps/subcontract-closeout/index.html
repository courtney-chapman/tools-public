<script>
"use strict";

const value=(obj,path)=>path.split(".").reduce((a,k)=>a?.[k],obj);
const set=(obj,path,v)=>{let a=path.split("."),x=obj;for(const k of a.slice(0,-1))x=x[k];x[a.at(-1)]=v};
const field=(label,path,opts={})=>{const v=value(state,path);const id="f-"+path.replaceAll(".","-");if(opts.options)return `<label for="${id}">${esc(label)}<select id="${id}" data-field="${path}">${opts.options.map(o=>`<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o||"Choose…")}</option>`).join("")}</select></label>`;if(opts.textarea)return `<label for="${id}">${esc(label)}<textarea id="${id}" data-field="${path}">${esc(v)}</textarea></label>`;return `<label for="${id}">${esc(label)}<input id="${id}" data-field="${path}" type="${opts.type||"text"}" ${opts.type==="number"?'min="0" step="0.01"':''} value="${esc(v)}" ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:""}></label>`};
const radio=(label,path,choices=YESNO,hidden=false)=>`<fieldset><legend ${hidden?'class="sr"':""}>${esc(label)}</legend><div class="choices">${choices.map((c,i)=>`<label data-choice="${esc(c)}"><input type="radio" name="${esc(path)}" data-field="${esc(path)}" value="${esc(c)}" ${value(state,path)===c?"checked":""}>${esc(c)}</label>`).join("")}</div></fieldset>`;
const btn=(action,text,cls="")=>`<button type="button" data-action="${esc(action)}" class="${cls}">${text}</button>`;
const badge=(s)=>`<span class="badge ${/review|unknown|pending/i.test(s)?"warn":/incomplete|follow.up|outstanding/i.test(s)?"bad":/complete|documented/i.test(s)?"good":""}">${esc(s)}</span>`;
const num=v=>v===null||v===""||v===undefined?null:Number(v);
const money=v=>v===null?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(v);
const identified=()=>!!(state.subcontract.supplier.trim()&&state.subcontract.number.trim()&&state.subcontract.description.trim());
function derive(){const a=state.applicability, items=[];for(const [id,name,group,key,mode,why] of RULES){let ans=key?a[key]:null,app="Recommended",classification="Administrative practice";if(mode==="yes"){app=ans==="Yes"?"Conditional":ans==="Unknown"?"Requires Review":"Not Applicable";classification="Contract-specific"}if(mode==="no"){app=ans==="No"?"Conditional":ans==="Unknown"?"Requires Review":ans==="Not Applicable"?"Not Applicable":"Recommended";classification="Subcontract performance"}if(mode==="cost"){app=state.subcontract.type==="Cost-Reimbursement"?"Requires Review":"Not Applicable";classification="Contract-specific"}if(mode==="tm"){app=["Time-and-Materials","Labor-Hour"].includes(state.subcontract.type)?"Requires Review":"Not Applicable";classification="Contract-specific"}if(id==="special"&&ans==="Yes"&&state.contractTerms.specialReference.trim())app="Required";if(id==="retention"&&state.contractTerms.retentionReference.trim())app="Conditional";if(id==="continuing"&&ans==="Yes"&&state.contractTerms.continuingReference.trim())app="Conditional";if(id==="property"||id==="propertyDisposition")if(ans==="Unknown")app="Requires Review";const saved=state.checklistItems.find(x=>x.id===id);items.push({id,name,group,applicability:app,classification,why,status:saved?.status||"Pending",reference:saved?.reference||"",notes:saved?.notes||""})}for(const c of state.checklistItems.filter(x=>x.custom))items.push({...c,group:GROUPS.includes(c.group)?c.group:"Contractual Documentation"});return items}
function validations(){const missing=[],actions=[],review=[],a=state.applicability;if(!state.subcontract.supplier.trim())missing.push("Supplier name");if(!state.subcontract.number.trim())missing.push("Subcontract or purchase order number");if(!state.subcontract.description.trim())missing.push("Supplies or services description");if(!state.subcontract.type)missing.push("Subcontract type");for(const [key,label] of QUESTIONS)if(a[key]==="Unknown")review.push(label);for(const item of derive())if(item.applicability==="Requires Review"){if(!RULES.some(([id,,,key])=>id===item.id&&key&&a[key]==="Unknown"))review.push(item.name)}else if(["Required","Conditional"].includes(item.applicability)&&item.status==="Not Applicable")review.push(`Applicable item marked Not Applicable: ${item.name}`);else if(["Required","Conditional"].includes(item.applicability)&&item.status!=="Complete"&&item.status!=="Not Applicable")actions.push(item.name);if(a.delivery==="No"&&a.acceptance==="Yes")review.push("Acceptance marked Yes while delivery is marked No");if(a.payments==="No"&&state.financials.finalInvoicePaid==="No")review.push("No outstanding payments conflicts with final invoice marked unpaid");if(state.financials.finalInvoicePaid==="Yes"&&state.financials.finalInvoiceReceived==="No")review.push("Final invoice marked paid but not received");for(const d of state.deliverables)if(d.acceptance!=="Accepted")actions.push(`Deliverable: ${d.name||"unnamed"}`);for(const i of state.issues)if(i.status!=="Resolved")actions.push(`Issue: ${i.name||"unnamed"}`);if(a.payments==="Yes")actions.push("Invoices or payments reported outstanding; confirm resolution");if(state.financials.outstandingInvoices!==null&&state.financials.outstandingInvoices>0)actions.push("Outstanding invoice amount entered");if(a.payments==="Yes"&&state.financials.retainage==="Yes")actions.push("Retainage, withhold, credit, or refund remains open");if(a.property==="Yes"&&!state.property.reference.trim())review.push("Property involved without a record reference");if(a.property==="No"&&Object.values(state.property).some(x=>String(x||"").trim()))review.push("Property details remain entered although property is marked No");for(const item of derive())if(["Required","Conditional"].includes(item.applicability)&&item.status==="Complete"&&!item.reference.trim())review.push(`Completed item lacks supporting reference: ${item.name}`);for(const c of state.checklistItems.filter(x=>x.custom&&x.applicability==="Required"&&!x.reference?.trim()))review.push(`Contract-specific item lacks authority: ${c.name||"unnamed"}`);if(state.financials.invoiced!==null&&state.financials.paid!==null&&state.financials.invoiced-state.financials.paid>0.01)actions.push("Invoiced amount exceeds paid amount");if(state.financials.paid!==null&&state.financials.invoiced!==null&&state.financials.paid-state.financials.invoiced>0.01)review.push("Paid amount exceeds invoiced amount");if(state.financials.invoiced!==null&&state.subcontract.currentValue!==null&&state.financials.invoiced-state.subcontract.currentValue>0.01)review.push("Invoiced amount exceeds current subcontract value");if(state.documentStatus==="documented"&&(missing.length||actions.length||review.length))review.push("Closeout Documented selected with open items; resolve or explain before treating record as final");return {missing:[...new Set(missing)],actions:[...new Set(actions)],review:[...new Set(review)]}}
const list=(rows,empty)=>rows.length?`<ul class="compact">${rows.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="muted small">${empty}</p>`;
const openBoard=v=>`<div class="open-board" aria-label="Open items">${[

function renderInformation(){document.querySelector("#information").innerHTML=`<h2>1. Subcontract information</h2><p class="muted">Identify the subcontract and record only the details needed for this closeout.</p><div class="grid">${field("Supplier / subcontractor name","subcontract.supplier")}${field("Subcontract or PO number","subcontract.number")}${field("Supplies or services","subcontract.description")}${field("Subcontract type","subcontract.type",{options:["",...TYPES]})}${field("Current subcontract value (optional)","subcontract.currentValue",{type:"number"})}${field("Final delivery / performance date","subcontract.completionDate",{type:"date"})}</div><details><summary>More identification and value details</summary><div class="grid" style="margin-top:12px">${field("Original award value","subcontract.originalValue",{type:"number"})}${field("Buyer / administrator","subcontract.buyer")}${field("Prime contract number","subcontract.primeNumber")}${field("Project reference","subcontract.project")}${field("Modification history / reference","subcontract.modifications",{textarea:true})}</div></details><div class="panel"><h3>Deliverables and acceptance</h3><p class="muted small">Delivery and formal acceptance are separate. Add material deliverables only when a single overall answer is insufficient.</p><div id="deliverableRows">${state.deliverables.map((d,i)=>`<div class="row rowhead"><div><strong>${esc(d.name||"Unnamed deliverable")}</strong><div class="small muted">${esc(d.date||"No date")} · ${esc(d.acceptance||"Unknown")} · ${esc(d.reference||"No reference")}</div></div><div>${btn("edit-deliverable:"+i,"Edit")}${btn("remove-deliverable:"+i,"Remove","danger")}</div></div>`).join("")}</div>${btn("add-deliverable","Add deliverable")}</div><div class="actions">${btn("next:applicability","Continue to applicability →","primary")}</div>`}
function renderApplicability(){
 const groups=GROUPS.map(group=>{
  const questions=QUESTIONS.filter(([, , section])=>section===group);
  if(!questions.length)return "";
  const unanswered=questions.filter(([key])=>state.applicability[key]==="Unknown").length;
  return `<details class="applicability-group" data-app-group="${esc(group)}" ${expandedApplicability.has(group)?"open":""}><summary>${esc(group)}<span class="group-count">${unanswered} unanswered</span></summary>${questions.map(([key,label])=>`<div class="qrow"><p id="q-${key}">${esc(label)}</p>${radio(label,`applicability.${key}`,YESNO,true)}</div>`).join("")}</details>`;
 }).join("");
 document.querySelector("#applicability").innerHTML=`<h2>2. Closeout applicability</h2><p class="muted">Answer from the subcontract and records. Unknown stays open for review; No does not mean a requirement was waived.</p><div class="toolbar">${btn("expand-applicability","Expand all")}${btn("collapse-applicability","Collapse all")}</div>${groups}<details class="applicability-group" data-app-group="terms" ${expandedApplicability.has("terms")?"open":""}><summary>Contract-specific terms and records</summary><div class="grid" style="margin-top:12px">${field("Special closeout clause / term reference","contractTerms.specialReference")}${field("Continuing-obligation term reference","contractTerms.continuingReference")}${field("Retention rule or clause reference","contractTerms.retentionReference")}${field("Records custodian","contractTerms.custodian")}${["Yes","Unknown"].includes(state.applicability.property)||Object.values(state.property).some(x=>String(x||"").trim())?`${field("Property type (GFP, CAP, other)","property.kind")}${field("Property record reference","property.reference")}${field("Property notes","property.notes",{textarea:true})}`:""}</div></details><details class="applicability-group" data-app-group="finance" ${expandedApplicability.has("finance")?"open":""}><summary>Financial snapshot <span class="small muted">optional</span></summary><div class="grid three">${field("Total invoiced","financials.invoiced",{type:"number"})}${field("Total paid","financials.paid",{type:"number"})}${field("Known outstanding invoices","financials.outstandingInvoices",{type:"number"})}${field("Known adjustments / credits","financials.adjustments",{type:"number"})}${field("Final invoice number","financials.finalInvoiceNumber")}${field("Final invoice date","financials.finalInvoiceDate",{type:"date"})}${field("Final invoice amount","financials.finalInvoiceAmount",{type:"number"})}${field("Financial record reference","financials.reference")}</div><div class="stack" style="margin-top:14px">${radio("Final invoice received","financials.finalInvoiceReceived")}${radio("Final invoice reviewed","financials.finalInvoiceReviewed")}${radio("Final invoice paid","financials.finalInvoicePaid")}${radio("Retainage, withhold, credit or refund open?","financials.retainage")}</div><p id="financeMath" class="note small"></p></details><div class="actions">${btn("next:checklist","Continue to checklist →","primary")}</div>`;renderFinance()}
function renderFinance(){const e=document.querySelector("#financeMath");if(!e)return;const f=state.financials,s=state.subcontract;let x=[];if(s.currentValue!==null&&f.invoiced!==null)x.push(`Current value less invoiced: ${money(s.currentValue-f.invoiced)}`);if(f.invoiced!==null&&f.paid!==null)x.push(`Invoiced less paid: ${money(f.invoiced-f.paid)}`);if(s.currentValue!==null&&f.paid!==null)x.push(`Current value less paid: ${money(s.currentValue-f.paid)}`);e.textContent=x.length?x.join(" · ")+". Differences are review signals, not an accounting reconciliation.":"Enter two amounts to see arithmetic differences; no payment or closeout decision is made."}
function saveItem(id,path,v){let item=state.checklistItems.find(x=>x.id===id);if(!item){item={id};state.checklistItems.push(item)}item[path]=v}
function renderChecklist(){const items=derive(),visible=showAll?items:items.filter(x=>x.applicability!=="Not Applicable"),v=validations();document.querySelector("#checklist").innerHTML=`<h2>3. Conditional checklist</h2><p class="muted">Update status and references directly. A response never marks a task complete.</p><div class="toolbar">${btn("toggle-all",showAll?"Show applicable and unresolved":"Show all items")}${btn("expand-groups","Expand all")}${btn("collapse-groups","Collapse all")}${btn("add-custom","Add contract-specific item")}<span class="small muted">${visible.length} shown · ${items.length} total</span></div><div class="overview" aria-label="Checklist progress"><div class="metric"><strong>${items.filter(x=>x.status==="Complete").length}</strong><span>Complete</span></div><div class="metric metric-warn"><strong>${v.actions.length}</strong><span>Actions open</span></div><div class="metric metric-review"><strong>${v.review.length}</strong><span>To review</span></div></div><div class="progress" role="progressbar" aria-label="Checklist items complete" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${items.filter(x=>x.status==="Complete").length}"><span style="width:${items.length?Math.round(100*items.filter(x=>x.status==="Complete").length/items.length):0}%"></span></div><p class="small muted">Review the subcontract before using a Required classification. A completed item needs a supporting reference.</p>${GROUPS.map(g=>{let rows=visible.filter(x=>x.group===g);return rows.length?`<details class="panel checklist-group" data-group="${esc(g)}" ${expandedGroups.has(g)?"open":""}><summary>${esc(g)} <span class="small muted">${rows.length} items</span></summary><div class="tablewrap"><table><thead><tr><th scope="col">Item and basis</th><th scope="col">Applicability</th><th scope="col">Status</th><th scope="col">Reference</th><th scope="col">Notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="small muted">${esc(x.why||x.classification)}</div>${x.custom?btn("remove-custom:"+x.id,"Remove","danger"):""}</td><td>${badge(x.applicability)}<div class="small muted">${esc(x.classification)}</div></td><td><label class="sr" for="st-${esc(x.id)}">Status: ${esc(x.name)}</label><select id="st-${esc(x.id)}" data-item="${esc(x.id)}" data-prop="status">${["Pending","Complete","Incomplete","Not Applicable","Requires Review"].map(o=>`<option ${x.status===o?"selected":""}>${o}</option>`).join("")}</select></td><td><label class="sr" for="ref-${esc(x.id)}">Reference: ${esc(x.name)}</label><input id="ref-${esc(x.id)}" data-item="${esc(x.id)}" data-prop="reference" value="${esc(x.reference)}" placeholder="Document ID"></td><td><label class="sr" for="note-${esc(x.id)}">Notes: ${esc(x.name)}</label><input id="note-${esc(x.id)}" data-item="${esc(x.id)}" data-prop="notes" value="${esc(x.notes)}" placeholder="Optional"></td></tr>`).join("")}</tbody></table></div></details>`:""}).join("")}<details class="panel checklist-group" data-group="issues" ${expandedGroups.has("issues")?"open":""}><summary>Outstanding issues <span class="small muted">${state.issues.length}</span></summary><div>${state.issues.map((x,i)=>`<div class="row rowhead"><div><strong>${esc(x.name||"Unnamed issue")}</strong> ${badge(x.status||"Open")}<div class="small muted">${esc(x.owner||"No owner")} · ${esc(x.reference||"No reference")}</div></div><div>${btn("edit-issue:"+i,"Edit")}${btn("remove-issue:"+i,"Remove","danger")}</div></div>`).join("")}</div>${btn("add-issue","Add issue")}</details><details class="panel checklist-group" data-group="obligations" ${expandedGroups.has("obligations")?"open":""}><summary>Continuing obligations <span class="small muted">${state.continuingObligations.length}</span></summary><p class="small muted">Record the owner and term. Administrative closeout does not end these duties.</p><div>${state.continuingObligations.map((x,i)=>`<div class="row rowhead"><div><strong>${esc(x.name||"Unnamed obligation")}</strong> ${badge(x.status||"Open")}<div class="small muted">${esc(x.owner||"No owner")} · ${esc(x.reference||"No reference")}</div></div><div>${btn("edit-obligation:"+i,"Edit")}${btn("remove-obligation:"+i,"Remove","danger")}</div></div>`).join("")}</div>${btn("add-obligation","Add obligation")}</details><div class="actions">${btn("next:summary","Continue to summary →","primary")}</div>`}
function renderSummary(){const v=validations(),items=derive(),visible=items.filter(x=>finalShowAll||x.applicability!=="Not Applicable");document.querySelector("#summary").innerHTML=`<h2>4. Final documents</h2><p class="muted">Preview, copy, or print the current closeout record. Both documents remain drafts until reviewed.</p><details class="panel doc-settings" data-doc-settings ${documentsDetailsOpen?"open":""}><summary>Closeout inputs and open items <span class="small muted">${v.missing.length+v.actions.length+v.review.length} open</span></summary><div class="statuscols"><div><strong>Missing required information</strong>${list(v.missing,"None flagged")}</div><div><strong>Outstanding closeout action</strong>${list(v.actions,"None flagged")}</div><div><strong>Contractual review required</strong>${list(v.review,"None flagged")}</div></div><div class="grid" style="margin-top:14px"><label>Working status<select data-field="documentStatus">${[["in_progress","In Progress"],["ready_for_review","Ready for Internal Review"],["documented","Closeout Documented"],["requires_follow_up","Requires Follow-Up"]].map(([value,text])=>`<option value="${value}" ${state.documentStatus===value?"selected":""}>${text}</option>`).join("")}</select></label>${field("Buyer-entered closeout summary","closeoutSummary",{textarea:true})}</div><p class="small muted">Status is a record label, not Government approval or a release of continuing duties.</p></details><div class="overview" aria-label="Document readiness"><div class="metric"><strong>${v.missing.length}</strong><span>Missing fields</span></div><div class="metric metric-warn"><strong>${v.actions.length}</strong><span>Actions open</span></div><div class="metric metric-review"><strong>${v.review.length}</strong><span>To review</span></div></div><div class="doc-switch" role="group" aria-label="Choose final document"><button type="button" data-action="output:memo" aria-pressed="${output==="memo"}">Summary memorandum</button><button type="button" data-action="output:checklist" aria-pressed="${output==="checklist"}">Final checklist</button></div><div class="toolbar">${output==="checklist"?btn("toggle-final-all",finalShowAll?"Show applicable and unresolved":"Show all items"):""}${btn("copy-output",output==="memo"?"Copy summary":"Copy checklist","primary")}${btn("print","Print / Save PDF")}${output==="memo"?btn("copy-ai","Copy AI prompt"):""}${output==="checklist"?`<span class="small muted">${visible.length} shown · ${items.length} total</span>`:""}</div><div id="preview" class="panel"></div><p id="liveMessage" role="status" aria-live="polite" class="small">${esc(message)}</p><details class="panel"><summary>Save, import, or clear draft data</summary><div class="actions">${btn("export","Export JSON")}${btn("import","Import draft JSON")}${btn("import-related","Import related JSON")}${btn("clear","Clear draft","danger")}</div><p class="small muted">Import reads one selected JSON file locally and asks before replacing this draft. Copy AI prompt copies data; share it with an external service only when authorized.</p></details>`;document.querySelector("#preview").innerHTML=report(output,output==="checklist"?finalShowAll:showAll)}
function report(kind,includeAll=showAll){const v=validations(),s=state.subcontract,items=derive().filter(x=>includeAll||x.applicability!=="Not Applicable"),head=`<h1>${kind==="memo"?"Subcontract Closeout Summary":"Subcontract Closeout Checklist"}</h1><p><strong>${esc(s.supplier||"[INSERT: supplier]")}</strong> · ${esc(s.number||"[INSERT: subcontract/PO number]")} · ${esc(s.type||"[INSERT: type]")}</p><p>${esc(s.description||"[INSERT: supplies or services]")}</p><p class="document-status"><strong>Working status:</strong> ${esc(({in_progress:"In Progress",ready_for_review:"Ready for Internal Review",documented:"Closeout Documented",requires_follow_up:"Requires Follow-Up"})[state.documentStatus])}. ${v.missing.length||v.actions.length||v.review.length?"Draft / follow-up items remain.":"No open items flagged in this draft; contract review still controls."}</p>`;const open=`<h2>Open items</h2>${openBoard(v)}`;const finParts=[["Current value",s.currentValue],["Invoiced",state.financials.invoiced],["Paid",state.financials.paid]].filter(x=>x[1]!==null).map(([label,amount])=>`${label}: ${money(amount)}`);const fin=`<h2>Financial snapshot</h2><p>${finParts.length?finParts.join(" · ")+". ":"No financial amounts entered. "}Final invoice received / reviewed / paid: ${esc(state.financials.finalInvoiceReceived)} / ${esc(state.financials.finalInvoiceReviewed)} / ${esc(state.financials.finalInvoicePaid)}.</p>`;const refs=[...new Set([...items.map(x=>x.reference).filter(Boolean),...state.deliverables.map(x=>x.reference).filter(Boolean),...state.issues.map(x=>x.reference).filter(Boolean),...state.continuingObligations.map(x=>x.reference).filter(Boolean),state.financials.reference,state.property.reference,state.contractTerms.retentionReference].filter(Boolean))];const reference=`<h2>Supporting references</h2>${list(refs,"None entered")}`;if(kind==="memo")return `${head}<section><h2>Performance and acceptance</h2><p>Delivery complete: ${esc(state.applicability.delivery)}. Acceptance: ${ function validateImport(o){if(!o||typeof o!=="object"||Array.isArray(o)||o.schemaVersion!==VERSION)throw Error("Unsupported schema version or document.");let base=fresh(),required=["subcontract","applicability","financials","property","contractTerms"];for(const k of required)if(!o[k]||typeof o[k]!=="object"||Array.isArray(o[k]))throw Error("Invalid "+k);for(const k of ["deliverables","issues","continuingObligations","checklistItems","supportingReferences"])if(!Array.isArray(o[k])||o[k].length>500)throw Error("Invalid "+k);for(const [key,val] of Object.entries(base.subcontract)){const x=o.subcontract[key];if(val===null?x!==null&&!(typeof x==="number"&&Number.isFinite(x)&&x>=0):typeof x!=="string")throw Error("Invalid subcontract."+key)}for(const [key] of QUESTIONS)if(!YESNO.includes(o.applicability[key]))throw Error("Invalid applicability."+key);for(const [key,val] of Object.entries(base.financials)){const x=o.financials[key];if(val===null?x!==null&&!(typeof x==="number"&&Number.isFinite(x)&&x>=0):typeof x!=="string")throw Error("Invalid financials."+key)}for(const k of Object.keys(base.property))if(typeof o.property[k]!=="string")throw Error("Invalid property."+k);for(const k of Object.keys(base.contractTerms))if(typeof o.contractTerms[k]!=="string")throw Error("Invalid contractTerms."+k);for(const k of ["deliverables","issues","continuingObligations","checklistItems"]){let ids=new Set;for(const row of o[k]){if(!row||typeof row!=="object"||Array.isArray(row)||typeof row.id!=="string"||!row.id||!/^[A-Za-z0-9_-]{1,100}$/.test(row.id)||ids.has(row.id))throw Error("Invalid or duplicate "+k+" ID");ids.add(row.id);for(const [rk,rv] of Object.entries(row))if(typeof rv!=="string"&&typeof rv!=="boolean")throw Error("Invalid "+k+" field")}}if(o.subcontract.type&&!TYPES.includes(o.subcontract.type))throw Error("Invalid subcontract type");for(const k of ["finalInvoiceReceived","finalInvoiceReviewed","finalInvoicePaid","retainage"])if(!YESNO.includes(o.financials[k]))throw Error
