</style></head><body><header><h1>Supplier Performance Evaluation</h1><p>Offline evaluation · Ratings remain your judgment</p></header><main><nav id="nav" aria-label="Evaluation sections"></nav><div class="utility-bar"><button class="small" data-act="export">Save draft JSON</button><span>Entries stay in this tab until saved.</span></div><div id="message" role="status" aria-live="polite"></div><section id="view"></section><div id="report" class="report hidden"></div></main><footer>Built by Courtney · Revision 9 · No automatic save</footer><input id="importFile" type="file" accept="application/json,.json" class="hidden"><script>
(()=>{'use strict';
const names=['Supplier','Period','Performance','Issues','Summary','Review','Sheet'];
const ratings=['Not Rated','Not Applicable','Exceptional','Very Good','Satisfactory','Marginal','Unsatisfactory'];
const ratingTone=r=>r==='Unsatisfactory'?'bad':r==='Marginal'?'warn':r==='Exceptional'?'excellent':r==='Very Good'?'good':r==='Satisfactory'?'steady':'neutral';
const statusTone=r=>r==='Evaluation Documented'?'good':r==='Follow-Up Required'?'bad':r==='Ready for Internal Review'?'warn':'neutral';
const descriptions={Exceptional:'Documented results substantially exceeded the applicable expectation.', 'Very Good':'Documented results exceeded the applicable expectation.',Satisfactory:'Documented results met the applicable expectation.',Marginal:'Documented results fell short in a significant respect.',Unsatisfactory:'Documented results showed serious unmet expectations.'};
const defaults=['Quality','Delivery / schedule','Cost / price management','Technical / contractual performance','Communication / responsiveness'];
const metricDefs=[['on-time','On-time deliveries','percent'],['late','Late deliveries','count'],['rejection','Quality rejection rate','percent'],['defects','Defect count','count'],['actions','Corrective action count','count']];
const uid=()=>Math.random().toString(36).slice(2,10);
const MAX_ROWS=500,MAX_UPDATES=100,MAX_FILE_BYTES=20000000;
const blank=()=>({schemaVersion:'1.1',supplier:{name:'',scope:'',role:'',contact:''},subcontract:{number:'',project:'',type:'',requirements:''},evaluation:{type:'Routine periodic review',otherType:'',start:'',end:'',date:'',evaluator:'',title:''},categories:defaults.map((name,i)=>({id:'default-'+i,name,rating:'Not Rated',narrative:'',evidence:''})),performanceMetrics:metricDefs.map(([id,name,unit])=>({id,name,unit,mode:'none',numerator:'',denominator:'',value:'',evidence:''})),deliveryRecords:[],issues:[],supplierResponse:{text:'',considered:'Not reviewed',change:''},overallAssessment:{rating:'No Overall Rating',strengths:'',deficiencies:'',assessment:'',monitoring:''},supportingEvidence:[],internalReviews:[],documentStatus:'Draft'});
let state=blank(),step=Math.max(0,names.findIndex((_,i)=>location.hash==='#step-'+(i+1)));
let editingIssueId=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=(items,current)=>items.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
const inp=(label,path,value,kind='text',hint='')=>`<label>${esc(label)}<input data-path="${esc(path)}" type="${kind}" ${kind==='number'?'min="0" step="any"':kind==='text'?'maxlength="10000"':''} value="${esc(value)}">${hint?`<span class="hint">${esc(hint)}</span>`:''}</label>`;
const area=(label,path,value)=>`<label>${esc(label)}<textarea data-path="${esc(path)}" maxlength="10000">${esc(value)}</textarea></label>`;
const sel=(label,path,value,items)=>`<label>${esc(label)}<select data-path="${esc(path)}">${opt(items,value)}</select></label>`;
const msg=(s,problem=false)=>{document.getElementById('message').innerHTML=`<div class="status ${problem?'error':''}">${esc(s)}</div>`};
const get=(path)=>path.split('.').reduce((x,k)=>x?.[k],state);
const put=(path,value)=>{let a=path.split('.'),x=state;for(let i=0;i<a.length-1;i++)x=x[a[i]];x[a.at(-1)]=value};
const metricValue=m=>{if(m.mode==='none')return '';if(m.unit==='percent'&&m.mode==='measured'){let n=Number(m.numerator),d=Number(m.denominator);return m.numerator!==''&&m.denominator!==''&&d>0&&n>=0&&n<=d?(100*n/d).toFixed(1)+'%':'Invalid ratio'}let v=Number(m.value);return m.value!==''&&Number.isFinite(v)&&v>=0&&(m.unit!=='percent'||v<=100)?String(v)+(m.unit==='percent'?'%':''):'Invalid value'};
const days=(a,b)=>{if(!a||!b)return '';let x=Date.parse(a+'T00:00:00Z'),y=Date.parse(b+'T00:00:00Z');return Number.isFinite(x)&&Number.isFinite(y)?Math.round((y-x)/86400000):''};
const dateDelta=(base,actual)=>{let n=days(base,actual);return n===0?'on date':Math.abs(n)+' '+(Math.abs(n)===1?'day':'days')+' '+(n>0?'after':'before')};
const deliveryComparison=d=>{if(!d.actual)return 'Enter actual date to compare';let parts=[];if(d.baseline)parts.push('Original: '+dateDelta(d.baseline,d.actual));if(d.revised)parts.push('Approved revision: '+dateDelta(d.revised,d.actual));return parts.join(' · ')||'Enter a required date to compare'};
const issuesOpen=()=>state.issues.filter(x=>x.status!=='Closed').length;
function validate(s=state){let missing=[],evidence=[],review=[];if(!s.supplier.name.trim())missing.push('Supplier name');if(!s.supplier.scope.trim())missing.push('Goods or services provided');if(!s.evaluation.date)missing.push('Evaluation date');if(s.evaluation.type==='Other'&&!s.evaluation.otherType.trim())missing.push('Other evaluation type');if(s.evaluation.start&&s.evaluation.end&&s.evaluation.start>s.evaluation.end)review.push('Evaluation end date precedes start date');for(let c of s.categories){if(c.rating==='Not Rated')missing.push(c.name+' rating');if(['Exceptional','Marginal','Unsatisfactory'].includes(c.rating)&&!c.narrative.trim())evidence.push(c.name+' needs a supporting narrative');if(['Exceptional','Marginal','Unsatisfactory'].includes(c.rating)&&!c.evidence.trim())evidence.push(c.name+' needs an evidence reference')}for(let m of s.performanceMetrics){if(m.mode!=='none'&&metricValue(m).startsWith('Invalid'))review.push(m.name+' has invalid values');if(m.mode==='estimate'&&!m.evidence.trim())evidence.push(m.name+' estimate needs its basis')}for(let d of s.deliveryRecords){let applicable=d.revised||d.baseline;if(d.actual&&applicable&&days(applicable,d.actual)>0&&!d.reason.trim())review.push('A late delivery needs context before interpreting it')}for(let x of s.issues){if(!x.description.trim())missing.push('Issue description');if(x.finding==='Confirmed'&&!x.evidence.trim())evidence.push('Confirmed issue needs evidence');if(x.status==='Closed'&&(!x.resolutionDate||!x.closureRationale.trim()))review.push('Closed issue needs a date and closure rationale');if(x.status==='Disputed'||x.finding==='Disputed')review.push('Disputed issue requires review');else if(x.status!=='Closed')review.push('Unresolved corrective action: '+(x.description||'untitled issue'))}if(s.supplierResponse.considered==='Reviewed — evaluation changed'&&!s.supplierResponse.change.trim())review.push('Explain how the supplier response changed the evaluation');if(['Exceptional','Marginal','Unsatisfactory'].includes(s.overallAssessment.rating)&&!s.overallAssessment.assessment.trim())evidence.push('Significant overall rating needs an evaluator assessment');for(let r of s.internalReviews){if(r.disposition!=='Not reviewed'){if(!r.name.trim())missing.push('Reviewer name for '+r.role+' review');if(!r.date)missing.push('Review date for '+r.role+' review')}if(r.disposition==='Follow-up requested')review.push('Internal reviewer requested follow-up')}if(!s.subcontract.requirements.trim())review.push('Confirm applicable subcontract performance requirements');if(s.documentStatus==='Evaluation Documented'&&(missing.length||evidence.length||review.length))review.push('Documented status conflicts with open items');return {missing,evidence,review}}
function shownStatus(){let v=validate();if(v.missing.length||v.evidence.length)return 'Draft';if(issuesOpen()||state.internalReviews.some(r=>r.disposition==='Follow-up requested'))return 'Follow-Up Required';if(v.review.length)return 'Ready for Internal Review';return state.documentStatus}

ce:${i}">Remove</button></div>`).join('')}<button data-add="evidence" ${state.supportingEvidence.length>=MAX_ROWS?'disabled':''}>Add reference</button></details><div class="assessment-next"><button class="primary" data-step="3">Continue to Issues →</button></div></div>`}

function reportHtml(){let s=state,e=s.evaluation,o=s.overallAssessment,v=validate();let cell=x=>esc(x||'—');let table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;let p=(name,val)=>`<p><strong>${esc(name)}:</strong> ${cell(val)}</p>`;return `<h2>Supplier Performance Evaluation</h2><p><strong>Documentation status:</strong> ${esc(shownStatus())} · ${issuesOpen()} unresolved issue(s)</p><section class="break"><h3>1. Supplier and subcontract</h3>${p('Supplier',s.supplier.name||'[INSERT: supplier name]')}${p('Goods or services',s.supplier.scope||'[INSERT: goods or services]')}${p('Role',s.supplier.role)}${p('Supplier contact',s.supplier.contact)}${p('Subcontract / PO',s.subcontract.number)}${p('Project',s.subcontract.project)}${p('Subcontract type',s.subcontract.type)}${p('Applicable requirements',s.subcontract.requirements||'[INSERT: applicable requirements]')}</section><section class="break"><h3>2. Evaluation type and period</h3>${p('Type',e.type==='Other'?e.otherType:e.type)}${p('Dates',[e.start,e.end].filter(Boolean).join(' to ')||'Single event / not specified')}${p('Evaluation date',e.date||'[INSERT: evaluation date]')}</section><section><h3>3. Performance ratings and rationale</h3>${table(['Category','Rating','Rationale / evidence'],s.categories.map(c=>[cell(c.name),cell(c.rating),`${cell(c.narrative)}<br><small>Evidence: ${cell(c.evidence)}</small>`]))}</section>${s.performanceMetrics.some(m=>m.mode!=='none')?`<section><h3>4. Objective metrics</h3>${table(['Metric','Source','Value / basis'],s.performanceMetrics.filter(m=>m.mode!=='none').map(m=>[cell(m.name),cell(m.mode),`${cell(metricValue(m))}${m.unit==='percent'&&m.mode==='measured'?'<br>Measured: '+cell(m.numerator)+' / '+cell(m.denominator):''}<br>${cell(m.evidence)}`]))}</section>`:''}${s.deliveryRecords.length?`<section><h3>5. Delivery records</h3>${table(['Original / revised','Actual / difference','Context and evidence'],s.deliveryRecords.map(d=>[`${cell(d.baseline)} / ${cell(d.revised)}`,`${cell(d.actual)}<br>${esc(deliveryComparison(d))}`,`${cell(d.reason)}<br>${cell(d.evidence)}`]))}</section>`:''}${s.issues.length?`<section><h3>6. Issues and corrective actions</h3>${s.issues.map(x=>`<div class="break">${p('Issue',x.description)}${p('Finding / status',x.finding+' / '+x.status)}${p('Identified / severity',x.date+' / '+x.severity)}${p('Affected requirement',x.requirement)}${p('Evidence',x.evidence)}${p('Action type',x.actionKind)}${p('Requested action',x.request)}${p('Owner / due',x.owner+' / '+x.due)}${p('Supplier response',x.response)}${p('Proposed action',x.proposed)}${p('Implementation date',x.implemented)}${p('Verification',x.verification)}${x.updates.map(u=>p('Follow-up '+u.date,u.note)).join('')}${p('Closure decision',x.status==='Closed'?x.closureRationale+' ('+x.resolutionDate+')':'Open / not closed')}</div>`).join('')}</section>`:''}<section class="break"><h3>7. Overall evaluation</h3>${p('Overall rating',o.rating)}${p('Strengths',o.strengths)}${p('Deficiencies',o.deficiencies)}${p('Assessment',o.assessment)}${p('Future monitoring',o.monitoring)}${s.supplierResponse.text?p('Supplier statement (separate from evaluator findings)',s.supplierResponse.text):''}${s.supportingEvidence.length?`<h3>Additional evidence references</h3><ul>${s.supportingEvidence.map(x=>`<li>${cell(x)}</li>`).join('')}</ul>`:''}${p('Response considered',s.supplierResponse.considered)}${s.supplierResponse.change?p('Evaluation change',s.supplierResponse.change):''}</section><section class="break"><h3>8. Evaluator and review</h3>${p('Evaluator',e.evaluator)}${p('Title',e.title)}${s.internalReviews.length?table(['Role / reviewer','Date','Feedback / comments'],s.internalReviews.map(r=>[`${cell(r.role)} / ${cell(r.name)}`,cell(r.date),`${cell(r.disposition)}<br>${cell(r.comments)}`])):''}${p('Open documentation items',v.missing.length+v.evidence.length+v.review.length)}</section><section><h3>9. Open documentation items</h3>${[['Missing information',v.missing],['Evidence needed',v.evidence],['Review required',v.review]].map(([label,items])=>items.length?`<h4>${esc(label)}</h4><ul class="checklist">${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'').join('')||'<p>None flagged.</p>'}</section>`}

function checkImport(x){
 if(!x||typeof x!=='object'||Array.isArray(x)||!['1.0','1.1'].includes(x.schemaVersion))throw Error('Unsupported schema version');if(x.schemaVersion==='1.0')x={...x,schemaVersion:'1.1',internalReviews:[]};
 let model=blank(),text=v=>typeof v==='string'&&v.length<=10000,date=v=>{if(!v)return true;if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;let d=new Date(v+'T00:00:00Z');return !Number.isNaN(d.valueOf())&&d.toISOString().slice(0,10)===v};
 for(let k of Object.keys(model))if(!(k in x))throw Error('Missing '+k);if(Object.keys(x).some(k=>!(k in model)))throw Error('Unexpected top-level field');
 for(let k of ['supplier','subcontract','evaluation','supplierResponse','overallAssessment']){if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k]))throw Error('Invalid '+k);for(let f of Object.keys(model[k]))if(!text(x[k][f]))throw Error('Invalid '+k+'.'+f);if(Object.keys(x[k]).some(f=>!(f in model[k])))throw Error('Unexpected '+k+' field')}
 for(let k of ['categories','performanceMetrics','deliveryRecords','issues','supportingEvidence','internalReviews'])if(!Array.isArray(x[k])||x[k].length>MAX_ROWS)throw Error('Invalid '+k);
 if(x.categories.length<5||x.categories.length>10||x.performanceMetrics.length<5||x.performanceMetrics.length>15)throw Error('Invalid category or metric count');
 for(let k of ['categories','performanceMetrics','deliveryRecords','issues','internalReviews']){let shape=(model[k][0]||({deliveryRecords:{id:'',baseline:'',revised:'',actual:'',reason:'',evidence:''},issues:newIssue(),internalReviews:newReview()})[k]),seen=new Set();for(let row of x[k]){if(!row||typeof row!=='object'||Array.isArray(row))throw Error('Invalid '+k+' row');for(let f of Object.keys(shape))if(f!=='updates'&&!text(row[f]))throw Error('Invalid '+k+'.'+f);if(Object.keys(row).some(f=>!(f in shape)))throw Error('Unexpected '+k+' field');if(!row.id||seen.has(row.id))throw Error('Duplicate or empty '+k+' ID');seen.add(row.id)}}
 for(let i=0;i<5;i++){if(x.categories[i].id!==model.categories[i].id||x.categories[i].name!==model.categories[i].name||x.performanceMetrics[i].id!==model.performanceMetrics[i].id||x.performanceMetrics[i].unit!==model.performanceMetrics[i].unit)throw Error('Default category or metric changed')}
 for(let c of x.categories)if(!ratings.includes(c.rating))throw Error('Invalid category rating');if(!['Routine periodic review','Milestone review','Delivery / order review','Final performance review','Issue-driven review','Other'].includes(x.evaluation.type))throw Error('Invalid evaluation type');
 for(let m of x.performanceMetrics){if(!['none','measured','estimate','manual'].includes(m.mode)||!['percent','count'].includes(m.unit))throw Error('Invalid metric selection');if(m.mode!=='none'&&metricValue(m).startsWith('Invalid'))throw Error('Invalid metric value');if(m.unit==='count'&&m.mode!=='none'&&!Number.isInteger(Number(m.value)))throw Error('Count must be an integer')}
 for(let d of x.deliveryRecords)for(let k of ['baseline','revised','actual'])if(!date(d[k]))throw Error('Invalid delivery date');
 for(let r of x.internalReviews){if(!['Procurement','Program','Quality','Other'].includes(r.role)||!['Not reviewed','Comments recorded','No further comments','Follow-up requested'].includes(r.disposition)||!date(r.date))throw Error('Invalid internal review')}for(let i of x.issues){if(!Array.isArray(i.updates)||i.updates.length>MAX_UPDATES||i.updates.some(u=>!u||Object.keys(u).some(k=>!['date','note'].includes(k))||!text(u.date)||!text(u.note)||!date(u.date)))throw Error('Invalid issue history');if(!['Observation','Confirmed','Disputed'].includes(i.finding)||!['Open','In Progress','Pending Verification','Closed','Disputed'].includes(i.status)||!['Internal follow-up','Formal supplier request'].includes(i.actionKind)||!['Unspecified','Low','Moderate','High'].includes(i.severity))throw Error('Invalid issue selection');for(let k of ['date','due','resolutionDate','implemented'])if(!date(i[k]))throw Error('Invalid issue date')}
 for(let k of ['date','start','end'])if(!date(x.evaluation[k]))throw Error('Invalid evaluation date');
 if(!['Draft','Ready for Internal Review','Evaluation Documented','Follow-Up Required'].includes(x.documentStatus)||!ratings.slice(2).concat('No Overall Rating').includes(x.overallAssessment.rating))throw Error('Invalid document or overall status');
 if(!['Not reviewed','Reviewed — no change','Reviewed — evaluation changed'].includes(x.supplierResponse.considered)||x.supportingEvidence.some(v=>!text(v)))throw Error('Invalid response or evidence');
 if(JSON.stringify(x).length>MAX_FILE_BYTES)throw Error('File too large');return x
}
function mapExternal(x){
 if(!x||typeof x!=='object'||Array.isArray(x)||typeof x.schemaVersion!=='string')throw Error('Unrecognized JSON');let y=blank(),label='';
 const put=(obj,k,v)=>{if(typeof v==='string'&&v.length<=5000)obj[k]=v};
 if(x.primeContract&&x.subcontract&&x.consentApplicability){label='Consent package';put(y.supplier,'name',x.subcontract.supplierName);put(y.supplier,'scope',x.subcontract.scope);put(y.subcontract,'number',x.subcontract.number);put(y.subcontract,'project',x.primeContract.number)}
 else if(Array.isArray(x.negotiationIssues)&&x.tcopd){label='Negotiation memo';put(y.supplier,'name',x.supplier);put(y.supplier,'scope',x.requirement);put(y.subcontract,'number',x.subcontractNumber);put(y.subcontract,'project',x.program);if(typeof x.proposalReference==='string')y.supportingEvidence.push(x.proposalReference)}
 else if(x.procurement&&Array.isArray(x.checklistItems)){label='Procurement readiness checklist';put(y.supplier,'name',x.procurement.supplier);put(y.supplier,'scope',x.procurement.description);put(y.subcontract,'number',x.procurement.number);put(y.subcontract,'project',x.procurement.program)}
 else throw Error('Unsupported app JSON');
 return {record:y,label}
}
function newReview(){return {id:uid(),role:'Procurement',name:'',date:'',disposition:'Not reviewed',comments:''}}
function newIssue(){return {id:uid(),description:'',date:'',requirement:'',severity:'Unspecified',evidence:'',actionKind:'Internal follow-up',request:'',owner:'',due:'',status:'Open',resolutionDate:'',response:'',proposed:'',implemented:'',verification:'',closureRationale:'',finding:'Observation',updates:[]}}
function render(){let view=document.getElementById('view'),opened=[...view.querySelectorAll('details[open] > summary')].map(x=>x.textContent),openCategories=[...view.querySelectorAll('details.category[open]')].map(x=>x.dataset.categoryId);document.getElementById('nav').innerHTML=names.map((n,i)=>`<button data-step="${i}" aria-current="${i===step?'step':'false'}"><span class="step-num" aria-hidden="true">${i+1}</span>${esc(n)}</button>`).join('');view.innerHTML=[supplierView,periodView,assessmentView,issuesView,summaryView,reviewView,sheetView][step]();view.querySelectorAll('details > summary').forEach(x=>{if(opened.includes(x.textContent)||openCategories.includes(x.parentElement.dataset.categoryId))x.parentElement.open=true});document.getElementById('report').classList.toggle('hidden',step!==6);if(step===6)document.getElementById('report').innerHTML=reportHtml();if(step===3&&editingIssueId){let dialog=document.getElementById('issueDialog');if(dialog){dialog.addEventListener('cancel',()=>{editingIssueId=null;setTimeout(render,0)});dialog.showModal()}}}
function go(i){editingIssueId=null;step=i;location.hash='step-'+(i+1);render();let view=document.getElementById('view');view.tabIndex=-1;view.focus({preventScroll:true});window.scrollTo(0,0)}
async function copy(text){try{await navigator.clipboard.writeText(text);msg('Copied to clipboard.')}catch{msg('Clipboard unavailable. Select and copy from the evaluation preview instead.',true)}}
function download(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='supplier-performance-evaluation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('JSON exported. Keep the file in an approved location.')}
function prompt(){return 'Improve the supplier performance evaluation narrative. Identify unsupported ratings, reconcile metrics with the narrative, and identify unresolved corrective actions. Preserve all user-entered facts, ratings, dates, evidence references, and supplier statements. Do not invent metrics, failures, inspection results, corrective actions, or compliance conclusions. Return compatible schemaVersion 1.1 JSON only.\n\n'+JSON.stringify(state,null,2)}
document.addEventListener('input',e=>{let p=e.target.dataset.path;if(p){put(p,e.target.value);if(step===6){document.getElementById('report').innerHTML=reportHtml()}}});document.addEventListener('change',e=>{let p=e.target.dataset.path;if(p){put(p,e.target.value);if(p.startsWith('issues.')){if(p.endsWith('.status')&&e.target.value==='Closed'){let closure=document.getElementById('issueClosure');if(closure)closure.open=true}}else if(e.target.tagName==='SELECT'||e.target.type==='radio')render()}});document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){go(Number(b.dataset.step));return}if(b.dataset.editIssue!==undefined){editingIssueId=state.issues[Number(b.dataset.editIssue)]?.id||null;render();return}if(b.dataset.add){if(b.dataset.add==='category'&&state.categories.length<10)state.categories.push({id:uid(),name:'Custom category',rating:'Not Rated',narrative:'',evidence:''});if(b.dataset.add==='metric'&&state.performanceMetrics.length<15)state.performanceMetrics.push({id:uid(),name:'Other measure',unit:'count',mode:'none',numerator:'',denominator:'',value:'',evidence:''});if(b.dataset.add==='delivery'&&state.deliveryRecords.length<MAX_ROWS)state.deliveryRecords.push({id:uid(),baseline:'',revised:'',actual:'',reason:'',evidence:''});if(b.dataset.add==='issue'&&state.issues.length<MAX_ROWS){let issue=newIssue();state.issues.push(issue);editingIssueId=issue.id}if(b.dataset.add==='review'&&state.internalReviews.length<MAX_ROWS)state.internalReviews.push(newReview());if(b.dataset.add==='evidence'&&state.supportingEvidence.length<MAX_ROWS)state.supportingEvidence.push('');if(b.dataset.add.startsWith('update:')){let issue=state.issues[Number(b.dataset.add.split(':')[1])];if(issue.updates.length<MAX_UPDATES)issue.updates.push({date:'',note:''})}render();if(b.dataset.add==='category'){let last=document.querySelector('#view details.category:last-of-type');if(last)last.open=true}return}if(b.dataset.remove){let [k,i]=b.dataset.remove.split(':');if(confirm('Remove this record?')){state[k].splice(Number(i),1);render()}return}switch(b.dataset.act){case 'close-issue':{let id=editingIssueId;editingIssueId=null;render();let i=state.issues.findIndex(x=>x.id===id);document.getElementById('view').querySelector(`[data-edit-issue="${i}"]`)?.focus();break}case 'sheet':go(6);break;case 'review':go(5);break;case 'expand-categories':document.querySelectorAll('#view details.category').forEach(x=>x.open=true);break;case 'collapse-categories':document.querySelectorAll('#view details.category').forEach(x=>x.open=false);break;case 'copy':await copy(reportText());break;case 'prompt':await copy(prompt());break;case 'export':download();break;case 'import':document.getElementById('importFile').click();break;case 'print':document.getElementById('report').innerHTML=reportHtml();window.print();break;case 'clear':if(confirm('Clear this draft? Unsaved work will be lost.')){editingIssueId=null;state=blank();render();msg('Draft cleared.')}break}});document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>MAX_FILE_BYTES)throw Error('File too large');let raw=JSON.parse(await f.text()),mapped;try{mapped={record:checkImport(raw),label:'Supplier evaluation'}}catch(err){if(raw?.categories)throw err;mapped=mapExternal(raw)}if(confirm('Import '+mapped.label+' and replace the current draft? External imports bring over recognized identifiers only.')){editingIssueId=null;state=mapped.record;render();msg(mapped.label+' imported.')}}catch(err){msg('Import rejected: '+err.message,true)}e.target.value=''});window.addEventListener('hashchange',()=>{let i=names.findIndex((_,j)=>location.hash==='#step-'+(j+1));if(i>=0&&i!==step){editingIssueId=null;step=i;render()}});render();
})();
</script></body></html>
